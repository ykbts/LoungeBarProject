services:
  web:
    image: tomcat:latest
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./target/loungebar.war:/usr/local/tomcat/webapps/loungebar.war
      - ./tmp/server.xml:/usr/local/tomcat/conf/server.xml
      - ./logs:/usr/local/tomcat/webapps/my-logs
      - ./tmp/context.xml:/usr/local/tomcat/webapps.dist/manager/META-INF/context.xml 
      - ./tmp/tomcat-users.xml:/usr/local/tomcat/conf/tomcat-users.xml

  db:
    image: postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_PASSWORD=ferrothebest
      - POSTGRES_USER=fskcl
    volumes:
      - ./data/db:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fskcl" ]
      interval: 5s
      timeout: 10s
      retries: 50